name: Render sample ads

# Renders a batch of sample ads from the live catalog into ads/samples/ for review.
on:
  push:
    branches: [claude/project-thread-7spy7t]
    paths: [templates/**, scripts/generate.mjs, ads/copy.json, assets/**, .github/workflows/ads-samples.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Render samples
        run: node scripts/generate.mjs sample 12
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ads/samples site
          git diff --cached --quiet || (git commit -m "Render sample ads" && git pull --rebase && git push)
